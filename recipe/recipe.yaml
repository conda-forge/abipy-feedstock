schema_version: 1

context:
  name: abipy
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 60a416fa1535fd759432082cdf685bb0e97e0c322b7cfb7d0de61a62b402872f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - packaging
    - python >=${{ python_min }}
    - monty
    - tabulate
    - apscheduler <=3.10.4
    - pydispatcher >=2.0.5
    - tqdm
    - pyyaml >=3.11
    - ruamel.yaml >=0.16.12
    - pandas
    - numpy
    - scipy
    - sympy
    - spglib
    - pymatgen >=2023.3.23
    - netcdf4
    - matplotlib-base
    - seaborn
    - plotly
    - ipython
    - chart-studio
    - click
    - ase
    - phonopy
    - seekpath

tests:
  - python:
      imports:
        - abipy
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Open-source library for analyzing the results produced by ABINIT
  description: |
    AbiPy is a Python library to analyze the results produced by
    Abinit, an open-source program for the ab-initio calculations
    of the physical properties of materials within Density Functional
    Theory and Many-Body perturbation theory. It also provides tools
    to generate input files and workflows to automate ab-initio
    calculations and typical convergence studies. AbiPy is
    interfaced with pymatgen and this allows users to benefit from
    the different tools and python objects available in the pymatgen
    ecosystem.
  homepage: http://abinit.github.io/abipy
  repository: https://github.com/abinit/abipy
  documentation: http://abinit.github.io/abipy

extra:
  recipe-maintainers:
    - gmatteo
    - jan-janssen
